name: PR Checks

on:
  pull_request:
    branches:
      - main
      - alpha

jobs:
  pr_checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install dependencies
        run: yarn

      - name: Run TypeScript, ESLint, and Prettier checks
        working-directory: ./packages/hedron-desktop
        run: |
          yarn typecheck
          yarn lint
          yarn format
