name: PR Checks

on:
  pull_request:
    branches:
      - main
      - alpha

jobs:
  pr_checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install dependencies
        run: yarn

      - name: Run TypeScript
        working-directory: ./packages/hedron-desktop
        run: npm run typecheck

      - name: Run ESLint
        working-directory: ./packages/hedron-desktop
        run: npm run lint

      - name: Run Prettier
        working-directory: ./packages/hedron-desktop
        run: npm run format
